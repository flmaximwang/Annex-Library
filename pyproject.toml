[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annex-library"
version = "0.1.0"
description = "MCP service over one Annex Library checkout"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
annex-library-mcp = "annex_library.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
